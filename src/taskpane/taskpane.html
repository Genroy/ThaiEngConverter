<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thai-Eng Converter</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script src="taskpane.js"></script>
    <style>
      body { font-family: Sarabun, sans-serif; padding: 16px; background: #1e1e2e; color: #cdd6f4; }
      h2 { color: #cba6f7; margin-bottom: 8px; }
      .status { background: #313244; border-radius: 8px; padding: 12px; margin-bottom: 12px; font-size: 13px; }
      .status span { color: #a6e3a1; font-weight: bold; }
      .btn { width: 100%; padding: 10px; margin-top: 8px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-family: Sarabun, sans-serif; }
      .btn-primary { background: #cba6f7; color: #1e1e2e; font-weight: bold; }
      .btn-secondary { background: #45475a; color: #cdd6f4; }
      .log { background: #181825; border-radius: 8px; padding: 10px; font-size: 12px; height: 120px; overflow-y: auto; margin-top: 12px; }
      .log p { margin: 2px 0; color: #bac2de; }
    </style>
  </head>
  <body>
    <h2>🔤 Thai-Eng Converter</h2>
    <div class="status">Auto-convert: <span id="statusText">เปิดใช้งาน</span></div>
    <button class="btn btn-primary" id="toggleBtn" onclick="toggleAuto()">⏸ หยุดชั่วคราว</button>
    <button class="btn btn-secondary" style="margin-top:8px" onclick="convertNow()">🔄 แปลง Selection ตอนนี้</button>
    <div class="log" id="logBox"><p>พร้อมใช้งาน...</p></div>
  </body>
</html>
